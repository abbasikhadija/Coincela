services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: coincela
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: coincela
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coincela -d coincela']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
